name: AI Package

on:
  pull_request:
    paths:
      - "packages/ai/**"
      - "src/api/client/**"
  push:
    branches:
      - master
    paths:
      - "packages/ai/**"
      - "src/api/client/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK API
        run: bun run build:api

      - name: Generate AI tools
        run: bun run generate-ai-tools

      - name: Verify generated bindings are committed
        run: git diff --exit-code packages/ai/src/generated/

      - name: Build AI package
        run: bun run build:ai

      - name: Test AI package
        working-directory: packages/ai
        run: bun test
